language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  path_instructions:
    - path: "crates/**"
      instructions: "Review against spec/cwr contract chapters and CLAUDE.md: no unwrap/expect/panic in library code, typed located errors, closed eleven-code failure envelope, deterministic outputs, doc comments on public items."
    - path: "tests/cwr/cases/**"
      instructions: "Each driver must exercise the real implementation per acceptance clause, print one CLAUSE line per clause and exit non-zero on any failure; reject tautological or mocked checks."
    - path: "benchmark/**"
      instructions: "Metrics come from ledgers only; no external baselines; report numbers must equal analyse.py recomputation; no credential values anywhere."
    - path: "spec/cwr/**"
      instructions: "spec.kvx is normative; derived views are generated by the validator and must not be hand-edited."
  path_filters:
    - "!vendor/**"
    - "!benchmark/cassettes/**"
    - "!benchmark/results/**"
    - "!tests/cwr/evidence/**"
    - "!target/**"
chat:
  auto_reply: false
